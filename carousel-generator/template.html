<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700&family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #020804; --primary: #10b981; --text-main: #ffffff; }
        body { margin: 0; padding: 0; width: 1080px; height: 1350px; background-color: var(--bg-color); color: var(--text-main); font-family: 'Outfit', sans-serif; position: relative; overflow: hidden;}
        
        #bg-image { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; filter: brightness(1.0); }
        .dark-overlay { position: absolute; inset: 0; z-index: 2; background: rgba(0, 0, 0, 0.05); pointer-events: none; }
        .radial-shadow { position: absolute; inset: 0; z-index: 2; background: radial-gradient(circle at 50% 50%, rgba(0,0,0,0.65) 0%, rgba(0,0,0,0) 65%); pointer-events: none; }
        
        /* THE ULTIMATE STATIC UNBREAKABLE SHADOW LAYER. No math. No JS. Just a pure pixel block perfectly configured for standard slide geometries. */
        .cinematic-floor { position: absolute; bottom: 0; left: 0; right: 0; height: 130px; background: rgba(0,0,0,1); z-index: 2; pointer-events: none; }
        .cinematic-shadow { 
             position: absolute; top: 0; bottom: 0; left: 0; right: 0; z-index: 2; pointer-events: none;
             background: linear-gradient(to top, rgba(0,0,0,1) 0px, rgba(0,0,0,1) 130px, rgba(0,0,0,0.7) 22%, rgba(0,0,0,0) 55%);
        }
        .cinematic-shadow-cover { 
             position: absolute; bottom: 0; left: 0; right: 0; height: 42%; z-index: 2; pointer-events: none;
             background: linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,1) 23%, rgba(0,0,0,0.5) 45%, rgba(0,0,0,0) 100%);
        }

        #content { position: relative; z-index: 3; width: 100%; height: 100%; padding: 0; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; }
        
        .slide-counter { position: absolute; top: 35px; right: 35px; font-size: 24px; font-family: 'Inter', sans-serif; font-weight: 600; background: rgba(0,0,0,0.7); padding: 8px 18px; border-radius: 20px; z-index: 10; color: white; letter-spacing: 1px; }

        /* Stable content padding */
        .inner-content { flex: 1; min-height: 0; padding: 60px 80px 30px 80px; display: flex; flex-direction: column; justify-content: flex-end; margin-bottom: 130px; }
        
        .body-area-standard { display: flex; flex-direction: column; justify-content: flex-end; position: relative; z-index: 3; width: 100%; }
        
        /* Section Header perfectly embedded inside the text block layer */
        .card-section-label { font-size: 22px; font-weight: 600; font-family: 'Inter', sans-serif; letter-spacing: 2px; color: rgba(255,255,255,1); margin-bottom: 16px; text-transform: uppercase; text-shadow: 0 4px 15px rgba(0,0,0,0.9); }

        .cover-header-row { position: absolute; top: 50px; left: 80px; right: 80px; display: flex; justify-content: space-between; align-items: flex-start; z-index: 10; }
        .idea-badge {
            padding: 10px 20px;
            border-radius: 9999px;
            /* Background and explicit glows managed dynamically via JS */
            color: rgba(255,255,255,1);
            font-family: 'Outfit', sans-serif;
            font-size: 17px;
            font-weight: 400;
            letter-spacing: 0.05em;
        }
        
        .cover-tags { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; max-width: 500px; }
        .cover-tags .tag { border: 1.5px solid var(--primary); padding: 6px 20px; border-radius: 40px; color: var(--primary); font-size: 18px; font-weight: 500; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); }
        
        .cover-center-wrapper { position: absolute; inset: 0; padding: 0 80px; z-index: 5; pointer-events: none;}
        .cover-title-group { position: absolute; left: 80px; right: 80px; bottom: 450px; transform: translateY(50%); display: flex; flex-direction: column; text-align: left; }
        .cover-title { font-size: 160px; font-weight: 700; letter-spacing: -3px; line-height: 1; margin: 0 0 10px 0; text-shadow: 0 8px 30px rgba(0,0,0,0.8); text-align: left; }
        .cover-descriptor { font-size: 44px; font-weight: 300; line-height: 1.4; max-width: 900px; margin: 10px 0 0 0; text-shadow: 0 5px 20px rgba(0,0,0,0.9); text-align: left; opacity: 0.95; }

        .standard-subtitle { font-size: 48px; font-weight: 600; color: rgba(255,255,255,1); font-family: 'Outfit', sans-serif; margin: 0 0 16px 0; line-height: 1.2; text-shadow: 0 4px 12px rgba(0,0,0,0.9); }
        .standard-text { font-size: 30px; font-weight: 300; line-height: 1.3; font-family: 'Inter', sans-serif; margin: 0; text-shadow: 0 4px 15px rgba(0,0,0,0.9); width: 100%; max-width: 900px; }

        .hook-massive-stat { font-size: 115px; font-weight: 700; color: var(--text-main); line-height: 1.05; letter-spacing: -3px; margin: 0 0 20px 0; text-shadow: 0 8px 30px rgba(0,0,0,0.8); }
        .hook-text { font-size: 30px; font-weight: 300; line-height: 1.3; font-family: 'Inter', sans-serif; margin: 0; text-shadow: 0 4px 20px rgba(0,0,0,0.9); max-width: 920px; color: rgba(255,255,255,0.9); }

        .list-container { display: flex; flex-direction: column; gap: 20px; width: 100%; max-width: 960px; margin-top: 10px; overflow: hidden; }
        .list-card { background: rgba(0,0,0,0.4); border-left: 5px solid var(--primary); border-radius: 6px 16px 16px 6px; padding: 24px 30px; backdrop-filter: blur(12px); box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
        .list-card-title { font-size: 38px; font-weight: 600; color: #ffffff; margin-bottom: 6px; font-family: 'Outfit'; }
        .list-card-desc { font-size: 24px; font-weight: 300; line-height: 1.3; font-family: 'Inter', sans-serif; color: rgba(255,255,255,0.9); }
        
        .list-container[data-count="4"] { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .list-container[data-count="4"] .list-card { padding: 18px 24px; border-left-width: 4px; }
        .list-container[data-count="4"] .list-card-title { font-size: 32px; margin-bottom: 6px; }
        .list-container[data-count="4"] .list-card-desc { font-size: 18px; line-height: 1.3; }

        .cta-slide-container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; padding: 0 80px; }
        .cta-quote { font-weight: 500; letter-spacing: -1px; color: #ffffff; font-style: italic; margin-bottom: 60px; font-family: 'Outfit'; text-shadow: 0 8px 30px rgba(0,0,0,0.8); }
        .cta-link { font-size: 32px; font-weight: 400; color: #fff; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3); padding: 18px 48px; border-radius: 50px; backdrop-filter: blur(10px); }

        .footer-abs { position: absolute; bottom: 0; left: 0; right: 0; height: 130px; display: flex; justify-content: space-between; align-items: center; padding: 0 80px; z-index: 10; }
        .logo-container { width: 350px; height: 75px; overflow: hidden; display: flex; align-items: center; justify-content: flex-start; }
        .logo-img { height: 100%; width: auto; transform: scale(1.6); transform-origin: left center; filter: brightness(1.1); }
        .slug-name { font-size: 34px; font-weight: 400; font-family: 'Outfit', sans-serif; opacity: 0.8; margin-bottom: 0; }
    </style>
</head>
<body>
    <img id="bg-image" src="" alt="">
    <div class="dark-overlay"></div>
    <div class="cinematic-floor"></div>
    <div class="cinematic-shadow"></div>
    <div class="cinematic-shadow-cover" style="display: none;"></div>
    <div id="radial-overlay"></div>
    <div id="content"></div>

    <script>
        window.renderSlide = function(type, data, index, totalSlides, imageSrc, logoSrc, slugTitle, ideaNumber, themeColor, slug) {
            var content = document.getElementById('content');
            var bgImage = document.getElementById('bg-image');
            var radialOverlay = document.getElementById('radial-overlay');
            var cinematicShadow = document.querySelector('.cinematic-shadow');
            var cinematicFloor = document.querySelector('.cinematic-floor');
            
            // Defeat passive Chromium 8-digit hex parsing failures by physically transpiling to standard RGBA interpolation arrays inside the browser engine
            var hexString = themeColor ? (themeColor.startsWith('#') ? themeColor : '#' + themeColor) : '#10b981';
            var rChannel = parseInt(hexString.length >= 7 ? hexString.slice(1, 3) : '63', 16);
            var gChannel = parseInt(hexString.length >= 7 ? hexString.slice(3, 5) : '66', 16);
            var bChannel = parseInt(hexString.length >= 7 ? hexString.slice(5, 7) : 'f1', 16);
            
            var pillBg = 'rgba(0, 0, 0, 0.4)';
            var pillBorder = 'rgba(' + rChannel + ',' + gChannel + ',' + bChannel + ', 1)';
            var pillShadow = 'none';

            if (imageSrc) {
                bgImage.src = imageSrc;
                bgImage.style.display = 'block';
            } else {
                bgImage.style.display = 'none';
            }

            var cinematicShadowCover = document.querySelector('.cinematic-shadow-cover');

            // Lock the cinematic shadow down to the floor on ALL slides except CTA.
            if (type === 'cta') {
                radialOverlay.className = 'radial-shadow';
                cinematicShadow.style.display = 'none';
                cinematicShadowCover.style.display = 'none';
            } else if (type === 'cover') {
                radialOverlay.className = 'radial-shadow';
                cinematicShadow.style.display = 'none';
                cinematicShadowCover.style.display = 'block';
            } else {
                radialOverlay.className = '';
                cinematicShadow.style.display = 'block';
                cinematicShadowCover.style.display = 'none';
            }

            var logoElement = logoSrc ? 
                '<div class="logo-container"><img class="logo-img" src="' + logoSrc + '" alt="AGI Futures"></div>' : 
                '<div style="font-size: 38px; color: #10b981; font-weight: 600;">AGI Futures</div>';

            var slugElement = type !== 'cover' ? '<div class="slug-name">' + slugTitle + '</div>' : '';

            var footerHtml = 
                '<div class="footer-abs">' +
                    logoElement +
                    slugElement +
                '</div>';

            var html = '';

            if (type === 'cover') {
                var tagHtml = '';
                if (data.tags && data.tags.length > 0) {
                    tagHtml = '<div class="cover-tags">' + data.tags.map(function(t) { return '<div class="tag">' + t + '</div>'; }).join('') + '</div>';
                }
                
                html = 
                    '<div class="cover-header-row">' +
                        '<div class="idea-badge" style="background: ' + pillBg + '; border: 1.5px solid ' + pillBorder + '; box-shadow: ' + pillShadow + ';">AGI Proof Startup Idea #' + (ideaNumber || 'X') + '</div>' +
                        tagHtml +
                    '</div>' +
                    '<div class="cover-center-wrapper">' +
                        '<div class="cover-title-group">' +
                            '<h1 class="cover-title">' + (data.title || '') + '</h1>' +
                            '<p class="cover-descriptor">' + (data.text || '') + '</p>' +
                        '</div>' +
                    '</div>' +
                    footerHtml;
            } else if (type === 'cta') {
                var quoteLength = data.title ? data.title.length : 0;
                var quoteSize = quoteLength > 200 ? '40px' : (quoteLength > 120 ? '50px' : '64px');
                var quoteLineHeight = quoteLength > 120 ? '1.4' : '1.3';

                var footerCtaHtml = '<div class="footer-abs">' + logoElement + '</div>';
                html = 
                    '<div class="slide-counter">' + index + '/' + totalSlides + '</div>' +
                    '<div class="inner-content">' +
                        '<div class="cta-slide-container">' +
                            '<h2 class="cta-quote" style="font-size: ' + quoteSize + '; line-height: ' + quoteLineHeight + ';">&ldquo;' + (data.title || '') + '&rdquo;</h2>' +
                            '<div class="cta-link">' + (data.text || '') + '</div>' +
                        '</div>' +
                    '</div>' +
                    footerCtaHtml;
            } else if (type === 'hook') {
                var headerTitle = data.sectionName || "The Hook";
                
                html = 
                    '<div class="slide-counter">' + index + '/' + totalSlides + '</div>' +
                    '<div class="inner-content">' +
                        '<div class="body-area-standard">' +
                            '<div class="card-section-label">' + headerTitle + '</div>' +
                            '<h2 class="hook-massive-stat">' + (data.title || '') + '</h2>' +
                            '<p class="hook-text">' + (data.text || '') + '</p>' +
                        '</div>' +
                    '</div>' +
                    footerHtml;
            } else {
                var headerTitle = data.sectionName || data.title || "Insight";
                if (type === 'oneLiner') headerTitle = data.sectionName || "The Pitch";

                var subtitleHtml = (data.title && data.title !== headerTitle && type !== 'oneLiner') ? '<h3 class="standard-subtitle">' + data.title + '</h3>' : '';

                var listHtml = '';
                if (data.list && data.list.length > 0) {
                    var cards = data.list.map(function(item) {
                        return '<div class="list-card">' +
                                  (item.title ? '<div class="list-card-title">' + item.title + '</div>' : '') +
                                  (item.description ? '<div class="list-card-desc">' + item.description + '</div>' : '') +
                               '</div>';
                    }).join('');
                    listHtml = '<div class="list-container" data-count="' + data.list.length + '">' + cards + '</div>';
                }

                var endTagsHtml = '';
                if (type === 'final' && data.tags && data.tags.length > 0) {
                    var tgs = data.tags.map(function(t) { return '<div class="tag">' + t + '</div>'; }).join('');
                    endTagsHtml = '<div class="cover-tags" style="justify-content: flex-start; margin-top: 30px;">' + tgs + '</div>';
                }

                var ctaHtml = '';
                if (type === 'final') {
                    var finalCtaText = 'Explore the full startup blueprint at <span style="font-weight: 600;">AGIFutures.org/' + (slug || '') + '</span>';
                    ctaHtml = '<div style="margin-top: 50px; display: flex; justify-content: center; width: 100%;"><div class="idea-badge" style="background: ' + pillBg + '; border: 1.5px solid ' + pillBorder + '; font-size: 23px; font-weight: 400; padding: 20px 20px; width: 100%; box-sizing: border-box; text-align: center; border-radius: 999px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">' + finalCtaText + '</div></div>';
                }

                html = 
                    '<div class="slide-counter">' + index + '/' + totalSlides + '</div>' +
                    '<div class="inner-content">' +
                        '<div class="body-area-standard">' +
                            '<div class="card-section-label">' + headerTitle + '</div>' +
                            subtitleHtml +
                            (data.text ? '<p class="standard-text">' + data.text + '</p>' : '') +
                            listHtml +
                            ctaHtml +
                            endTagsHtml +
                        '</div>' +
                    '</div>' +
                    footerHtml;
            }

            content.innerHTML = html;
        };
    </script>
</body>
</html>
